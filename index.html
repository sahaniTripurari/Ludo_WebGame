<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
  <title>Ludo Royale — Premium Board Game</title>
  <meta name="description" content="Play Ludo Royale, a premium classic board game with stunning visuals, smooth animations, and multiple game modes.">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Bungee&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="index.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='16' height='16' rx='3' fill='%23E74C3C'/><rect x='16' width='16' height='16' rx='3' fill='%232980B9'/><rect y='16' width='16' height='16' rx='3' fill='%2327AE60'/><rect x='16' y='16' width='16' height='16' rx='3' fill='%23F1C40F'/></svg>">
</head>

<body>
  <canvas id="particles-canvas"></canvas>

  <!-- HOME SCREEN -->
  <div class="screen active" id="screen-home">
    <div class="home-container">
      <div class="profile-bar">
        <div class="profile-avatar">
          <span class="avatar-letter">P</span>
          <span class="profile-level">Lv.1</span>
        </div>
        <div class="profile-info">
          <span class="profile-name" id="profile-name">Player</span>
          <div class="profile-coins">🪙 <span id="coin-count">5,000</span></div>
        </div>
        <button class="btn-icon" id="btn-settings-open">⚙️</button>
      </div>

      <div class="logo-section">
        <div class="logo-crown">👑</div>
        <h1 class="logo-title">LUDO<span class="logo-accent">Royale</span></h1>
        <p class="logo-subtitle">The King of Board Games</p>
      </div>

      <div class="menu-grid">
        <button class="menu-btn disabled-mode" disabled>
          <div class="menu-btn-icon">🌐</div>
          <div class="menu-btn-label">Online</div>
          <span class="badge-soon">Soon</span>
        </button>
        <button class="menu-btn disabled-mode" disabled>
          <div class="menu-btn-icon">👥</div>
          <div class="menu-btn-label">Friends</div>
          <span class="badge-soon">Soon</span>
        </button>
        <button class="menu-btn menu-btn-accent" id="btn-vs-computer">
          <div class="menu-btn-icon">🆚</div>
          <div class="menu-btn-label">Computer</div>
        </button>
        <button class="menu-btn menu-btn-accent" id="btn-pass-n-play">
          <div class="menu-btn-icon">🎮</div>
          <div class="menu-btn-label">Pass N Play</div>
        </button>
      </div>

      <button class="btn-sound-toggle-main" id="btn-sound-toggle-main">🔊</button>
    </div>
  </div>

  <!-- SETUP SCREENS (assuming standard setup flow) -->
  <div class="screen" id="screen-vs-computer">
    <div class="setup-container">
      <button class="btn-back" id="btn-back-vs">←</button>
      <h2 class="setup-title">VS Computer</h2>
      <div class="vs-options">
        <button class="vs-card" data-opponents="1">1 vs 1</button>
        <button class="vs-card selected" data-opponents="3">1 vs 3</button>
      </div>
      <div class="difficulty-pills">
        <button class="pill-btn active" data-difficulty="easy">Easy</button>
        <button class="pill-btn" data-difficulty="medium">Medium</button>
        <button class="pill-btn" data-difficulty="hard">Hard</button>
      </div>
      <button class="btn-next" id="btn-next-vs">Next →</button>
    </div>
  </div>

  <div class="screen" id="screen-pass-n-play">
    <div class="setup-container">
      <button class="btn-back" id="btn-back-pnp">←</button>
      <h2 class="setup-title">Pass N Play</h2>
      <div class="player-count-pills">
        <button class="pill-btn active" data-players="2">2 Players</button>
        <button class="pill-btn" data-players="3">3 Players</button>
        <button class="pill-btn" data-players="4">4 Players</button>
      </div>
      <button class="btn-next" id="btn-next-pnp">Next →</button>
    </div>
  </div>

  <div class="screen" id="screen-tokens">
    <div class="setup-container">
      <button class="btn-back" id="btn-back-tokens">←</button>
      <h2 class="setup-title">Select Token</h2>
      <div class="token-carousel">
        <div class="token-option selected" data-token="classic">🔴 Classic</div>
        <div class="token-option" data-token="crown">👑 Crown</div>
        <div class="token-option" data-token="star">⭐ Star</div>
      </div>
      <button class="btn-next" id="btn-next-tokens">Next →</button>
    </div>
  </div>

  <div class="screen" id="screen-players">
    <div class="setup-container">
      <button class="btn-back" id="btn-back-players">←</button>
      <h2 class="setup-title">Players</h2>
      <div class="players-list" id="players-list"></div>
      <button class="btn-play" id="btn-start-game">🎲 Play!</button>
    </div>
  </div>

  <!-- GAME SCREEN -->
  <div class="screen" id="screen-game">
    <div class="game-layout">
      <!-- Top Row: Player 2 (Top Left) and Player 3 (Top Right) -->
      <div class="player-row">
        <div class="player-box-container" id="player-box-2"></div>
        <div class="player-box-container" id="player-box-3"></div>
      </div>

      <!-- Center: Board -->
      <div class="board-container">
        <canvas id="board" width="660" height="660"></canvas>
      </div>

      <!-- Bottom Row: Player 1 (Bottom Left) and Player 4 (Bottom Right) -->
      <div class="player-row">
        <div class="player-box-container" id="player-box-0"></div>
        <div class="player-box-container" id="player-box-1"></div>
      </div>

      <!-- Action Buttons -->
      <div class="hud-actions">
        <button class="btn-hud" id="btn-menu-toggle">📋 Menu</button>
        <button class="btn-hud" id="btn-exit-ingame">❌ Exit</button>
      </div>
    </div>
  </div>

  <!-- OVERLAYS -->
  <div class="overlay" id="overlay-menu">
    <div class="overlay-card">
      <h3 class="overlay-title">Game Menu</h3>
      <div class="settings-list">
        <div class="setting-row">
          <span>🎵 Music</span>
          <label class="toggle-switch">
            <input type="checkbox" id="toggle-music-game" checked>
            <span class="slider"></span>
          </label>
        </div>
        <div class="setting-row">
          <span>🔊 Sound</span>
          <label class="toggle-switch">
            <input type="checkbox" id="toggle-sfx-game" checked>
            <span class="slider"></span>
          </label>
        </div>
      </div>
      <div class="menu-options">
        <button class="menu-option-btn" id="btn-restart-game">Restart</button>
        <button class="menu-option-btn" id="btn-exit-game">Quit</button>
      </div>
      <button class="btn-close-overlay" id="btn-close-menu">Close</button>
    </div>
  </div>

  <div class="overlay" id="overlay-win">
    <div class="overlay-card">
      <div class="win-confetti" id="win-confetti"></div>
      <h2 class="win-title" id="win-title">Victory!</h2>
      <button class="btn-play-again" id="btn-play-again">Play Again</button>
      <button class="btn-home" id="btn-go-home">Home</button>
    </div>
  </div>

  <div class="overlay" id="overlay-settings">
    <div class="overlay-card">
      <h3 class="overlay-title">Settings</h3>
      <div class="settings-list">
        <div class="setting-row">
          <span>🎵 Music</span>
          <label class="toggle-switch">
            <input type="checkbox" id="toggle-music-home" checked>
            <span class="slider"></span>
          </label>
        </div>
        <div class="setting-row">
          <span>🔊 Sound</span>
          <label class="toggle-switch">
            <input type="checkbox" id="toggle-sfx-home" checked>
            <span class="slider"></span>
          </label>
        </div>
      </div>
      <button class="btn-close-overlay" id="btn-close-settings">Close</button>
    </div>
  </div>

  <div class="toast-container" id="toast-container"></div>

  <script src="js/audio.js"></script>
  <script src="js/particles.js"></script>
  <script src="js/board.js"></script>
  <script src="js/game.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>

</html>
